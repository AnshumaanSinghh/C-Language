name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    steps:
      - uses: actions/checkout@v5

      - name: Build with warnings as errors and run every problem
        run: make test STRICT=1 CC=${{ matrix.cc }}

      - name: Run every problem under AddressSanitizer and UBSan
        run: make sanitize STRICT=1 CC=${{ matrix.cc }}
